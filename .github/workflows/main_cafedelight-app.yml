name: Build and deploy PHP app to Azure Web App - cafedelight-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          php artisan key:generate || true
          php artisan config:cache
          php artisan route:cache

      - name: Create deployment folder
        run: |
          mkdir deploy
          rsync -av \
            --exclude deploy \
            --exclude .git \
            --exclude node_modules \
            ./ deploy/

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4AD8CA85BD784033AE6380210BE7EFC7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E365352B2D534CA1AA292AC27A7B7D73 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9EC2AAAABB7745D7A329229CB46D3057 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cafedelight-app'
          slot-name: 'Production'
          package: php-app
